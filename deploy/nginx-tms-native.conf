# Native (no Docker) TMS — Nginx
# URL: http://tms.144.91.98.218.nip.io  (and optional custom domain)
# Install:
#   sudo cp deploy/nginx-tms-native.conf /etc/nginx/sites-available/tms
#   sudo ln -sf /etc/nginx/sites-available/tms /etc/nginx/sites-enabled/tms
#   sudo rm -f /etc/nginx/sites-enabled/default /etc/nginx/sites-enabled/tms-nipio
#   sudo nginx -t && sudo systemctl reload nginx

upstream tms_api {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name tms.144.91.98.218.nip.io 144.91.98.218;

    root /var/www/tms/web;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    client_max_body_size 20M;

    location /api/ {
        proxy_pass http://tms_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        alias /var/www/tms/api/wwwroot/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
